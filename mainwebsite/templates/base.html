{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  
  {% block schema %}{% endblock %}
  {% block meta %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Primary Meta Tags -->
    <meta name="title" content="Pardy Mobile Mechanics | Mobile Car Repair South Africa">
    <meta name="description" content="Pardy Mobile Mechanics offers professional mobile car repair and servicing across South Africa. We come to you — at home, work or roadside.">
    <meta name="keywords" content="mobile mechanic south africa, mobile car repair, roadside mechanic, car service at home, mobile mechanic johannesburg">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <link rel="canonical" href="https://pardymobilemechanics.co.za{{ request.path }}">

    <!-- Open Graph (WhatsApp, Facebook previews) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pardymobilemechanics.co.za{{ request.path }}">
    <meta property="og:title" content="Pardy Mobile Mechanics | Mobile Car Repair South Africa">
    <meta property="og:description" content="Professional mobile car repair and servicing. We come to you anywhere in South Africa.">
    <meta property="og:image" content="{% static 'img/logoo.png' %}">
  {% endblock %}
    <title>Pardy mobile mechanic</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    {% include 'navbar.html' %}
    {% block content %}{% endblock %}

            <footer class="py-3 my-4 text-white">

                <li class="nav-item"><a href="{% url 'services' %}" class="nav-link px-2 text-reset">Services</a></li>
                <li class="nav-item"><a href="{% url 'contacts' %}" class="nav-link px-2 text-reset">Contacts</a></li>
                <li class="nav-item"><a href="{% url 'about' %}" class="nav-link px-2 text-reset">About</a></li>
              </ul>
              <p class="text-center text-reset me-1">&copy; 2026 Pardy mobile mechanics | Developed by <a href="https://www.macronsynergy.co.zw" class="text-decoration-none">Marcon Synergy</a></p>
            </footer>
          </div>
    </footer>
    <script src="{% static 'js/bootstrap/bootstrap.min.js' %}"></script>
